<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hearth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --lava: #ff3621;
  --lava-pressed: #eb1600;
  --navy: #1b3139;
  --navy-700: #143d4a;
  --oat: #f9f7f4;
  --oat-mid: #eeede9;
  --muted: #5f737d;
  --link: #016bc1;
  --border: #e4e2dd;
  --white: #ffffff;
  --success-bg: #f9fffa;
  --rail: 56px;
  --top: 48px;
  --font: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex;
  min-height: 100dvh;
  background: var(--oat);
  color: var(--navy);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.rail {
  width: var(--rail); flex: 0 0 var(--rail);
  background: var(--oat-mid); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0; gap: 8px;
}
.rail .brand {
  width: 32px; height: 32px; display: grid; place-items: center;
  background: var(--lava); color: var(--white); font-weight: 700; font-size: 14px;
  border-radius: 2px; margin-bottom: 8px;
}
.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.topbar {
  height: var(--top); flex: 0 0 var(--top);
  background: var(--white); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 0 16px;
}
.wordmark {
  font-size: 18px; font-weight: 500; color: var(--navy);
  text-transform: lowercase; margin: 0;
}
.top-meta { margin-left: auto; font-size: 12px; color: var(--muted); }
.workspace-main { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 32px; height: 32px; padding: 0 16px; border: 0; border-radius: 2px;
  font: 500 13px/1 var(--font); cursor: pointer; white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-ghost { background: var(--white); color: var(--navy); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--oat); }
.chat-shell {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 240px minmax(0, 1fr);
  background: var(--oat);
}
.chat-side {
  border-right: 1px solid var(--border); background: var(--oat-mid);
  padding: 12px 10px; display: flex; flex-direction: column; min-height: 0;
}
.chat-new { width: 100%; margin-bottom: 10px; }
.chat-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.chat-list-empty { color: var(--muted); font-size: 13px; padding: 8px; margin: 0; }
.chat-item {
  display: block; padding: 8px 10px; border-radius: 2px;
  color: var(--navy); font-size: 13px; line-height: 1.3; border: 0;
  background: transparent; text-align: left; cursor: pointer; width: 100%; font-family: inherit;
}
.chat-item:hover { background: var(--white); text-decoration: none; }
.chat-item.on { background: var(--white); box-shadow: inset 3px 0 0 var(--lava); font-weight: 500; }
.chat-item-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--oat); }
.chat-stage:has(#chat-empty:not([hidden])) { justify-content: center; }
.chat-stage:has(#chat-empty:not([hidden])) .chat-scroll { flex: 0 1 auto; overflow: visible; }
.chat-scroll { flex: 1; min-height: 0; overflow: auto; }
.chat-empty { max-width: 48rem; margin: 0 auto; padding: 24px 24px 8px; text-align: left; }
.chat-empty h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 40px); font-weight: 500; letter-spacing: -0.03em; }
.chat-empty p { margin: 0 0 24px; color: var(--muted); max-width: 36em; }
.chat-suggests { display: flex; flex-wrap: wrap; gap: 8px; }
.chat-suggest {
  background: var(--white); border: 1px solid var(--border); color: var(--navy);
  border-radius: 2px; padding: 8px 12px; font: 500 13px/1.3 var(--font); cursor: pointer;
}
.chat-suggest:hover { border-color: var(--navy); }
.chat-thread {
  max-width: 48rem; margin: 0 auto; padding: 24px 24px 12px;
  display: flex; flex-direction: column; gap: 20px;
}
.chat-thread[hidden], .chat-empty[hidden] { display: none !important; }
.chat-turn.user { display: flex; justify-content: flex-end; }
.chat-bubble {
  max-width: min(36rem, 85%); background: var(--white);
  border: 1px solid var(--border); border-radius: 12px 12px 2px 12px; padding: 10px 14px;
}
.chat-bubble p { margin: 0; }
.chat-bubble p + p { margin-top: 8px; }
.chat-turn.assistant { display: flex; flex-direction: column; gap: 8px; }
.chat-pending { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.chat-tools { display: flex; flex-direction: column; gap: 2px; }
.chat-step { color: var(--navy); }
.chat-step-row {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) 12px;
  align-items: start; column-gap: 8px; padding: 3px 0;
}
.chat-step-icon { display: grid; place-items: center; width: 16px; height: 18px; color: var(--navy); }
.chat-step.running .chat-step-icon { color: var(--lava); }
.chat-step-copy { min-width: 0; }
.chat-step-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font-size: 13px; line-height: 1.4; }
.chat-step-verb { font-weight: 500; }
.chat-step.running .chat-step-verb { color: var(--muted); }
.chat-step-target {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
.chat-step-sum { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.4; }
.chat-step-code {
  margin: 6px 0 8px 24px; background: var(--white); border: 1px solid var(--border);
  border-radius: 2px; font-family: var(--mono); font-size: 12px; line-height: 1.45;
  overflow: auto; max-height: 280px; padding: 8px 0;
}
.chat-step-code .ln { padding: 0 12px; white-space: pre; }
.chat-step-code .add { background: var(--success-bg); }
.chat-step-code .del { background: #fdeeee; }
.chat-spin {
  width: 10px; height: 10px; flex: 0 0 10px; margin-top: 4px;
  background: var(--lava); animation: chat-spin 800ms var(--ease-standard) infinite;
}
.chat-pending .chat-spin { margin-top: 0; }
@keyframes chat-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(90deg); } }
.chat-prose { color: var(--navy); font-size: 15px; line-height: 1.65; }
.chat-prose.typing { min-height: 1.65em; }
.chat-prose p { margin: 0 0 10px; }
.chat-prose p:last-child { margin-bottom: 0; }
.chat-prose ul { margin: 0 0 10px; padding-left: 1.2em; }
.chat-prose code { font-family: var(--mono); font-size: 13px; background: var(--white); padding: 1px 4px; border-radius: 2px; }
.chat-caret {
  display: inline-block; width: 7px; height: 1.05em; background: var(--lava);
  margin-left: 2px; vertical-align: text-bottom; transform-origin: bottom;
}
.chat-caret.idle { animation: chat-blink 1.05s steps(1) infinite; }
.chat-prose.typing .chat-caret { animation: chat-caret-write 240ms var(--ease-standard) infinite; }
@keyframes chat-blink { 50% { opacity: 0; } }
@keyframes chat-caret-write { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.72); } }
@media (prefers-reduced-motion: reduce) {
  .chat-spin, .chat-caret, .chat-caret.idle, .chat-prose.typing .chat-caret { animation: none; }
}
.chat-composer {
  max-width: 48rem; width: calc(100% - 48px); margin: 0 auto 20px; position: relative;
  background: var(--white); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 48px 28px 14px; box-shadow: 0 8px 24px rgba(27, 49, 57, 0.08);
}
.chat-composer textarea {
  width: 100%; border: 0; resize: none; background: transparent; color: var(--navy);
  font: 15px/1.45 var(--font); min-height: 24px; max-height: 200px; padding: 0;
}
.chat-composer textarea:focus { outline: none; }
.chat-send {
  position: absolute; right: 10px; top: 10px; width: 32px; height: 32px;
  border: 0; border-radius: 2px; background: var(--navy); color: var(--white);
  display: grid; place-items: center; cursor: pointer;
}
.chat-send[hidden], .chat-stop[hidden] { display: none; }
.chat-send:hover { background: var(--navy-700); }
.chat-stop { background: var(--lava); }
.chat-stop:hover { background: var(--lava-pressed); }
.chat-stop-sq { width: 10px; height: 10px; background: var(--white); }
.chat-model { position: absolute; left: 14px; bottom: 8px; margin: 0; font-size: 11px; color: var(--muted); }
@media (max-width: 560px) {
  .rail { width: 48px; flex-basis: 48px; }
  .chat-shell { grid-template-columns: 1fr; }
  .chat-side { display: none; }
  .chat-composer { width: calc(100% - 24px); }
}
</style>
</head>
<body class="chat-page">
<aside class="rail"><div class="brand">h</div></aside>
<div class="workspace">
  <header class="topbar">
    <p class="wordmark">hearth</p>
    <p class="top-meta" id="top-meta"></p>
  </header>
  <div class="workspace-main">
    <div class="chat-shell">
      <aside class="chat-side">
        <button type="button" class="btn btn-ghost chat-new" id="chat-new">New chat</button>
        <nav class="chat-list" id="chat-list" aria-label="Chats"></nav>
      </aside>
      <div class="chat-stage">
        <div class="chat-scroll">
          <div class="chat-empty" id="chat-empty">
            <h1>Ask Aider</h1>
            <p>This chat is Aider. Qwen on this box reads, edits, and shows every change — no cloud.</p>
            <div class="chat-suggests">
              <button type="button" class="chat-suggest" data-suggest="List the files in this workspace.">What's in the workspace?</button>
              <button type="button" class="chat-suggest" data-suggest="Create hello.py that prints hello from hearth, then show me the file.">Write a hello.py</button>
              <button type="button" class="chat-suggest" data-suggest="Add a short README.md that explains this workspace.">Write a README</button>
            </div>
          </div>
          <div class="chat-thread" id="chat-thread" hidden></div>
        </div>
        <form class="chat-composer" id="chat-form">
          <label class="sr-only" for="chat-input">Message</label>
          <textarea id="chat-input" rows="1" placeholder="Ask Aider to read, edit, or run something" autocomplete="off"></textarea>
          <button type="submit" class="chat-send" id="chat-send" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
            </svg>
          </button>
          <button type="button" class="chat-send chat-stop" id="chat-stop" hidden aria-label="Stop">
            <span class="chat-stop-sq"></span>
          </button>
          <p class="chat-model" id="chat-model">Aider</p>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  const thread = document.getElementById("chat-thread");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("chat-send");
  const stopBtn = document.getElementById("chat-stop");
  const listEl = document.getElementById("chat-list");
  const empty = document.getElementById("chat-empty");
  const modelEl = document.getElementById("chat-model");
  const newBtn = document.getElementById("chat-new");
  const params = new URLSearchParams(location.search);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let sessionId = params.get("c") || "";
  let abort = null;
  let streaming = false;

  const ICONS = {
    read: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="3" y="2" width="10" height="12" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 5h5M5.5 8h5M5.5 11h3" stroke="currentColor" stroke-width="1.4"/></svg>',
    search: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.2" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg>',
    write: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M9 3.5 12.5 7 6 13.5H2.5V10L9 3.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="miter"/></svg>',
    run: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 3.5 13 8 4 12.5V3.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="miter"/></svg>',
    list: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M3 8h10M3 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg>',
    call: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="3" y="3" width="4" height="4" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="4" height="4" stroke="currentColor" stroke-width="1.4"/><path d="M7 5h2v6" stroke="currentColor" stroke-width="1.4"/></svg>'
  };

  function resize() {
    input.style.height = "24px";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }
  input.addEventListener("input", resize);
  resize();

  function md(text) {
    const raw = String(text || "");
    const escaped = raw.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const withCode = escaped.replace(/`([^`]+)`/g, "<code>$1</code>");
    const withBold = withCode.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return withBold.split(/\n{2,}/).map((block) => {
      const lines = block.split("\n");
      const items = lines.filter((l) => /^\s*[-*]\s+/.test(l));
      if (items.length && items.length === lines.filter((l) => l.trim()).length) {
        return "<ul>" + items.map((l) => "<li>" + l.replace(/^\s*[-*]\s+/, "") + "</li>").join("") + "</ul>";
      }
      return "<p>" + lines.join("<br/>") + "</p>";
    }).join("");
  }

  function scrollBottom() {
    thread.parentElement.scrollTop = thread.parentElement.scrollHeight;
  }

  function setBusy(on) {
    streaming = on;
    sendBtn.hidden = on;
    stopBtn.hidden = !on;
    input.disabled = on;
  }

  function showEmpty(on) {
    empty.hidden = !on;
    thread.hidden = on;
  }

  function codeBlock(preview) {
    if (!preview) return null;
    const pre = document.createElement("pre");
    pre.className = "chat-step-code";
    String(preview).split("\n").forEach((line) => {
      const div = document.createElement("div");
      div.className = "ln";
      if (line.startsWith("+") && !line.startsWith("+++")) div.classList.add("add");
      else if (line.startsWith("-") && !line.startsWith("---")) div.classList.add("del");
      div.textContent = line || " ";
      pre.appendChild(div);
    });
    return pre;
  }

  function toolCard(row) {
    const art = document.createElement("article");
    const running = row.status === "running";
    art.className = "chat-step" + (running ? " running" : " done");
    art.dataset.id = row.id || "";
    const icon = ICONS[row.icon] || ICONS.call;
    const verb = running
      ? (row.calling || ("Calling " + (row.verb || row.name || "tool")))
      : (row.verb || row.name || "Call");
    const target = row.target || "";
    art.innerHTML =
      '<div class="chat-step-row">' +
        '<span class="chat-step-icon">' + icon + "</span>" +
        '<span class="chat-step-copy">' +
          '<span class="chat-step-line">' +
            '<span class="chat-step-verb"></span>' +
            (target ? '<span class="chat-step-target"></span>' : "") +
          "</span>" +
          (row.summary && !running ? '<span class="chat-step-sum"></span>' : "") +
        "</span>" +
        (running ? '<span class="chat-spin" aria-hidden="true"></span>' : "") +
      "</div>";
    art.querySelector(".chat-step-verb").textContent = verb;
    const targetEl = art.querySelector(".chat-step-target");
    if (targetEl) targetEl.textContent = target;
    const sumEl = art.querySelector(".chat-step-sum");
    if (sumEl) sumEl.textContent = row.summary || "";
    const code = codeBlock(row.preview);
    if (code) art.appendChild(code);
    return art;
  }

  function addUser(text) {
    showEmpty(false);
    const wrap = document.createElement("article");
    wrap.className = "chat-turn user";
    wrap.innerHTML = '<div class="chat-bubble">' + md(text) + "</div>";
    thread.appendChild(wrap);
    scrollBottom();
  }

  function addAssistant() {
    const wrap = document.createElement("article");
    wrap.className = "chat-turn assistant";
    wrap.innerHTML =
      '<div class="chat-pending"><span class="chat-spin" aria-hidden="true"></span><span>Working</span></div>' +
      '<div class="chat-tools"></div>' +
      '<div class="chat-prose"></div>';
    thread.appendChild(wrap);
    return wrap;
  }

  function hidePending(box) {
    const pending = box.querySelector(".chat-pending");
    if (pending) pending.remove();
  }

  function Typewriter(prose) {
    this.prose = prose;
    this.shown = "";
    this.queue = "";
    this.raf = 0;
    this.live = true;
  }
  Typewriter.prototype.push = function (text) {
    if (!text) return;
    if (reduceMotion) { this.shown += text; this.paint(true); return; }
    this.queue += text;
    this.kick();
  };
  Typewriter.prototype.flush = function () {
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; }
    this.shown += this.queue;
    this.queue = "";
    this.paint(this.live);
  };
  Typewriter.prototype.finish = function (finalText) {
    this.live = false;
    if (finalText != null) this.shown = String(finalText);
    else this.shown += this.queue;
    this.queue = "";
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; }
    this.paint(false);
  };
  Typewriter.prototype.kick = function () {
    if (this.raf) return;
    const step = () => {
      this.raf = 0;
      if (!this.queue) { this.paint(true); return; }
      const n = this.queue.length > 120 ? 16 : this.queue.length > 40 ? 7 : 3;
      this.shown += this.queue.slice(0, n);
      this.queue = this.queue.slice(n);
      this.paint(true);
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  };
  Typewriter.prototype.paint = function (caret) {
    const waiting = caret && !this.queue;
    this.prose.innerHTML = md(this.shown) + (caret ? '<span class="chat-caret' + (waiting ? " idle" : "") + '"></span>' : "");
    this.prose.classList.toggle("typing", !!(caret && this.queue));
    scrollBottom();
  };

  function renderHistory(messages) {
    thread.innerHTML = "";
    if (!messages || !messages.length) { showEmpty(true); return; }
    showEmpty(false);
    messages.forEach((msg) => {
      if (msg.role === "user") addUser(msg.content || msg.text || "");
      else {
        const box = addAssistant();
        hidePending(box);
        (msg.tools || []).forEach((t) => box.querySelector(".chat-tools").appendChild(toolCard(t)));
        box.querySelector(".chat-prose").innerHTML = md(msg.content || msg.text || "");
      }
    });
    scrollBottom();
  }

  function setSession(id, title) {
    sessionId = id || "";
    const url = new URL(location.href);
    if (sessionId) url.searchParams.set("c", sessionId);
    else url.searchParams.delete("c");
    history.replaceState(null, "", url.pathname + url.search);
    document.querySelectorAll(".chat-item").forEach((el) => {
      el.classList.toggle("on", el.dataset.id === sessionId);
    });
    if (title) {
      const item = document.querySelector('.chat-item[data-id="' + sessionId + '"]');
      if (item) item.querySelector(".chat-item-title").textContent = title;
    }
  }

  function itemHtml(row) {
    const a = document.createElement("button");
    a.type = "button";
    a.className = "chat-item" + (row.id === sessionId ? " on" : "");
    a.dataset.id = row.id;
    a.innerHTML = '<span class="chat-item-title"></span>';
    a.querySelector(".chat-item-title").textContent = row.title || "Chat";
    a.addEventListener("click", () => { if (!streaming) loadSession(row.id); });
    return a;
  }

  async function refreshList() {
    const res = await fetch("/chat/sessions");
    if (!res.ok) return;
    const data = await res.json();
    listEl.innerHTML = "";
    (data.sessions || []).forEach((row) => listEl.appendChild(itemHtml(row)));
    if (!(data.sessions || []).length) {
      listEl.innerHTML = '<p class="chat-list-empty">No chats yet</p>';
    }
  }

  async function loadSession(id) {
    const res = await fetch("/chat/sessions/" + encodeURIComponent(id));
    if (!res.ok) { setSession("", ""); renderHistory([]); return; }
    const data = await res.json();
    setSession(data.id, data.title);
    renderHistory(data.messages || []);
    refreshList();
  }

  async function loadModel() {
    try {
      const res = await fetch("/settings.json");
      if (!res.ok) return;
      const data = await res.json();
      const harness = data.harness ? data.harness + " " + (data.aider || "") : "";
      const model = data.model || "";
      const ws = data.workspace ? data.workspace.replace(/\/home\/[^/]+/, "~") : "";
      modelEl.textContent = [harness || "Aider", model, ws].filter(Boolean).join(" · ");
      const meta = document.getElementById("top-meta");
      if (meta && data.workspace) meta.textContent = data.workspace;
    } catch (e) {}
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const text = input.value.trim();
    if (!text || streaming) return;
    input.value = "";
    resize();
    addUser(text);
    const box = addAssistant();
    const toolsEl = box.querySelector(".chat-tools");
    const prose = box.querySelector(".chat-prose");
    const writer = new Typewriter(prose);
    setBusy(true);
    abort = new AbortController();
    const cards = {};
    try {
      const res = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, session_id: sessionId }),
        signal: abort.signal,
      });
      if (!res.ok || !res.body) {
        hidePending(box);
        writer.finish("Could not reach hearth. Try again.");
        setBusy(false);
        return;
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let acc = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const chunk of parts) {
          const line = chunk.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trim()).join("");
          if (!line) continue;
          let evnt;
          try { evnt = JSON.parse(line); } catch (e) { continue; }
          if (evnt.type === "session") {
            setSession(evnt.id, evnt.title);
            refreshList();
          } else if (evnt.type === "text") {
            hidePending(box);
            acc += evnt.text || "";
            writer.push(evnt.text || "");
          } else if (evnt.type === "tool") {
            hidePending(box);
            writer.flush();
            const id = evnt.id || evnt.name;
            let card = cards[id];
            const next = toolCard(evnt);
            if (!card) toolsEl.appendChild(next);
            else card.replaceWith(next);
            cards[id] = next;
            scrollBottom();
          } else if (evnt.type === "error") {
            hidePending(box);
            acc = evnt.message || "Something went wrong.";
            writer.finish(acc);
          } else if (evnt.type === "done") {
            hidePending(box);
            acc = evnt.text || acc;
            writer.finish(acc);
          }
        }
      }
      if (writer.live) writer.finish(acc);
    } catch (err) {
      hidePending(box);
      if (err.name !== "AbortError") writer.finish("The run stopped unexpectedly.");
      else writer.finish(writer.shown + writer.queue);
    }
    setBusy(false);
    abort = null;
    refreshList();
    input.focus();
  });

  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); form.requestSubmit(); }
  });
  stopBtn.addEventListener("click", () => { if (abort) abort.abort(); });
  newBtn.addEventListener("click", () => {
    if (streaming) return;
    setSession("", "");
    renderHistory([]);
    input.focus();
  });
  document.querySelectorAll("[data-suggest]").forEach((btn) => {
    btn.addEventListener("click", () => { input.value = btn.dataset.suggest; resize(); form.requestSubmit(); });
  });

  loadModel();
  refreshList();
  if (sessionId) loadSession(sessionId);
  else showEmpty(true);
})();
</script>
</body>
</html>
